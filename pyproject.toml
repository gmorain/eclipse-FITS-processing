[project]
name = "eclipse-align"
version = "1.0.0"
description = "Alignement sous-pixel et timelapse d'une eclipse solaire partielle"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "astropy>=6.1",
    "matplotlib>=3.9",
    "opencv-python>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eclipse"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
